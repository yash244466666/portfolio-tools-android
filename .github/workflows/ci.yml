name: CI

# This repository is public (ADR 0028), so standard GitHub-hosted runners are
# free and the former self-hosted runner was deleted. A self-hosted runner must
# never be attached to a public repository: fork pull requests could execute
# arbitrary code on the maintainer's workstation.
#
# `main` is the release branch; `dev` is the integration branch. Both run the
# full web and Android gate. Pull requests target `dev`, and releases promote
# `dev` to `main`.
#
# - `concurrency` cancels a superseded pull-request run.
# - `paths-ignore` skips prose-only pull requests; the work-item manifest lives
#   under `config/`, so its validation still runs.
# - The Android job uploads the debug APK, internal APK, and unsigned release
#   AAB as build artifacts. On a branch push, `debug-release` also publishes the
#   debug APK as a pre-release for testers. The AAB remains intentionally
#   unsigned until signing/key custody is approved; nothing here deploys to
#   Google Play.

on:
  pull_request:
    branches: [main, dev]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm css:tokens:check
      - run: pnpm contrast:check
      - run: pnpm github:actions:check
      - run: pnpm github:work-items:check
      - run: pnpm test
      - run: pnpm build
      - run: node scripts/check-pdf-worker-polyfill.mjs
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      # The action's default `packages` input is "tools platform-tools". Google
      # removed the legacy `tools` package, so only the still-published package
      # is requested; Gradle resolves the rest against the preinstalled SDK.
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: "platform-tools"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm cap:sync
      - run: ./android/gradlew -p android testDebugUnitTest lintDebug assembleDebug assembleInternal bundleRelease :app:assembleDebugAndroidTest
      - run: pnpm android:manifest:check debug
      - run: pnpm android:manifest:check internal
      - run: pnpm android:manifest:check release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: debug-apk-${{ github.ref_name }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: internal-apk-${{ github.ref_name }}
          path: android/app/build/outputs/apk/internal/app-internal.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-aab-${{ github.ref_name }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

  debug-release:
    if: github.event_name == 'push'
    needs: android-debug
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: debug-apk-${{ github.ref_name }}
          path: artifact
      - name: Publish the debug APK as a pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="debug-${GITHUB_REF_NAME}-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \
            -R "$GITHUB_REPOSITORY" \
            "artifact/app-debug.apk" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Debug build ${GITHUB_REF_NAME} #${GITHUB_RUN_NUMBER}" \
            --notes "Automated debug build from \`${GITHUB_REF_NAME}\` at \`${GITHUB_SHA}\`. Debug-signed, package \`dev.yash.tools.debug\`. Test-only; not a production candidate and not Play-signed."
