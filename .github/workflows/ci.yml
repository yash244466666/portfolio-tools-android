name: CI

# This repository is private, so hosted runner minutes are metered against the
# GitHub Free allowance (2,000 minutes per billing month). On 2026-09-15 the
# account exhausted that allowance and every job stopped being allocated a
# runner — jobs failed 2 s after starting with `runner_id: 0` and no steps,
# including re-runs of commits that had already passed.
#
# The jobs therefore run on the repository's self-hosted runner (label
# `yash-linux`, registered from the maintainer's Linux workstation), which is
# not metered. Both hosted jobs are kept as they were so the definition stays
# portable if the runner is retired:
#
#   - `concurrency` cancels a superseded pull-request run, so pushing twice to a
#     branch does not pay twice for the whole suite. `main` is deliberately never
#     cancelled: a half-verified main is worse than a slow one.
#   - `paths-ignore` skips pull requests that only touch prose. A documentation
#     change cannot alter the application, its tests, or the Android artifact, and
#     nothing in this workflow inspects Markdown. The work-item manifest lives
#     under `config/`, not `docs/`, so its validation still runs.
#
# If the self-hosted runner is removed, set both `runs-on` values back to
# `ubuntu-latest` and restore `--with-deps` on the Playwright install (that flag
# only exists because GitHub's hosted image needs the browsers' system packages
# installed at run time; here they are already present).

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web-quality:
    runs-on: [self-hosted, yash-linux]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm css:tokens:check
      - run: pnpm contrast:check
      - run: pnpm github:actions:check
      - run: pnpm github:work-items:check
      - run: pnpm test
      - run: pnpm build
      - run: node scripts/check-pdf-worker-polyfill.mjs
      - run: pnpm exec playwright install chromium
      - run: pnpm test:e2e

  android-debug:
    runs-on: [self-hosted, yash-linux]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      # The action's default `packages` input is "tools platform-tools". Google
      # removed the legacy `tools` package from the SDK repository, so the
      # default now fails with "Failed to find package 'tools'" before any
      # repository step runs — it broke this job for every branch, not just one
      # change. The pinned action ref is unchanged; only the input is narrowed
      # to the package the runner still publishes, and Gradle resolves the
      # remainder against the preinstalled SDK and the accepted licences.
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: "platform-tools"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm cap:sync
      - run: ./android/gradlew -p android testDebugUnitTest lintDebug assembleDebug :app:assembleDebugAndroidTest
      - run: pnpm android:manifest:check debug
