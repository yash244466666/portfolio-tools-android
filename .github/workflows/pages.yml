name: Pages preview

# Publishes a browser preview of both delivery branches (ADR 0028):
#   /<repo>/      -> the current `main` build
#   /<repo>/dev/  -> the current `dev` build
#
# The Android app itself is not deployed here; this is the Vite web harness,
# useful for review on a phone or desktop and for verifying the catalog and
# tool screens without installing an APK. It uses GitHub-hosted runners and the
# Pages deployment token; it has no access to signing or Play credentials.

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          path: main-src
      - name: Check out dev
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: dev
          path: dev-src
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            main-src/pnpm-lock.yaml
            dev-src/pnpm-lock.yaml
      - name: Build main preview
        working-directory: main-src
        run: |
          pnpm install --frozen-lockfile
          pnpm exec tsc -b
          pnpm exec vite build --base="/${GITHUB_REPOSITORY#*/}/" --outDir=dist
      - name: Build dev preview under /<repo>/dev/
        working-directory: dev-src
        run: |
          pnpm install --frozen-lockfile
          pnpm exec tsc -b
          pnpm exec vite build --base="/${GITHUB_REPOSITORY#*/}/dev/" --outDir=dist
      - name: Assemble the combined site
        run: |
          mkdir -p site
          cp -R main-src/dist/. site/
          mkdir -p site/dev
          cp -R dev-src/dist/. site/dev/
          test -f site/index.html
          test -f site/dev/index.html
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
